<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<script>(function(){try{var t=localStorage.getItem("protech-theme")||"light";document.documentElement.setAttribute("data-theme",t);}catch(e){document.documentElement.setAttribute("data-theme","light");}})();</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gallery — ProTech | IIT Delhi</title>
<meta name="description" content="Photo gallery of the ProTech research group at IIT Delhi.">
<link rel="stylesheet" href="styles.css">
</head>
<body data-page="gallery">

<header class="site" id="site-header"></header>

<section class="page-hero">
  <div class="container">
    <div class="crumb"><a href="index.html">Home</a> / Gallery</div>
    <h1>Gallery</h1>
    <p>Lab work, conferences, awards, and the moments in between. Click any photo to view it larger.</p>
  </div>
</section>

<section>
  <div class="container">
    <div class="section-head"><div class="eyebrow">Lab &amp; field work</div></div>
    <div class="gallery-grid">
      <div class="media"><img src="images/gallery/lab-equipment-setup.jpg" alt="Group members setting up testing equipment in the lab"></div>
      <div class="media"><img src="images/gallery/lab-team-photo.jpg" alt="Team group photo in the lab, with a mannequin in the background"></div>
      <div class="media"><img src="images/gallery/lab-ppe-group.jpg" alt="Group photo wearing masks during a facility visit"></div>
    </div>
  </div>
</section>

<section class="on-canvas">
  <div class="container">
    <div class="section-head"><div class="eyebrow on-canvas">Conferences &amp; awards</div></div>
    <div class="gallery-grid">
      <div class="media"><img src="images/gallery/conference-group-1.jpg" alt="Group photo at an international textile conference"></div>
      <div class="media"><img src="images/gallery/FTC-2025-group.jpg" alt="Group photo at an FTC 2025 conference"></div>
      <div class="media"><img src="images/gallery/gyti-honeybee-award.jpg" alt="Team receiving the GYTI award at the Honey Bee Network ceremony"></div>
      <div class="media"><img src="images/gallery/teaching-excellence-award.jpg" alt="Prof. Majumdar receiving the IIT Delhi Teaching Excellence Award 2024-25"></div>
    </div>
  </div>
</section>

<section>
  <div class="container">
    <div class="section-head"><div class="eyebrow">Team celebrations</div></div>
    <div class="gallery-grid">
      <div class="media"><img src="images/gallery/holi-old-celebration.jpg" alt="Old team celebrating Holi together"></div>
      <div class="media"><img src="images/gallery/cake-celebration-office-1.jpg" alt="Cake celebration in Prof. Majumdar's office"></div>
      <div class="media"><img src="images/gallery/cake-celebration-lounge.jpg" alt="Team cake celebration in the common room"></div>
      <div class="media"><img src="images/gallery/cake-celebration-senior-faculty.jpg" alt="Cake celebration with senior faculty"></div>
      <div class="media"><img src="images/gallery/celebration-masked-1.jpg" alt="Team celebration, group photo"></div>
      <div class="media"><img src="images/gallery/team-celebration-lounge-2.jpg" alt="Team group photo celebration"></div>
      <div class="media"><img src="images/gallery/team-office-group.jpg" alt="Team group photo in the office"></div>
      <div class="media"><img src="images/gallery/holi-celebration.jpg" alt="Team celebrating Holi together, covered in colours"></div>
      <div class="media"><img src="images/gallery/durga-puja-celebration.jpg" alt="Team at a Durga Puja celebration"></div>
    </div>
  </div>
</section>

<section class="on-canvas">
  <div class="container">
    <div class="section-head"><div class="eyebrow on-canvas">Outings &amp; team meals</div></div>
    <div class="gallery-grid">
      <div class="media"><img src="images/gallery/team-lunch-1.jpg" alt="Team lunch outing"></div>
      <div class="media"><img src="images/gallery/team-meal-guesthouse.jpg" alt="Team meal at a guesthouse dining hall"></div>
      <div class="media"><img src="images/gallery/team-dinner-outdoor-1.jpg" alt="Team members at an evening outing"></div>
      <div class="media"><img src="images/gallery/team-outing-garden.jpg" alt="Team members at an evening garden outing"></div>
      <div class="media"><img src="images/gallery/team-dinner-restaurant-2.jpg" alt="Team dinner at a restaurant"></div>
      <div class="media"><img src="images/gallery/team-guesthouse-group.jpg" alt="Team group photo at a guesthouse courtyard"></div>
    </div>
  </div>
</section>

<!--
  To add more photos: drop the file into images/gallery/, then add a new tile:
  <div class="media"><img src="images/gallery/your-filename.jpg" alt="Description"></div>
  Clicking any photo in the gallery grid opens a lightbox automatically.
-->

<footer class="site" id="site-footer"></footer>
<script src="script.js"></script>
</body>
</html>
